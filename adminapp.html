<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; max-width: 550px; margin: auto; }
    
    .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .back-btn { background: #333; color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #8B0018; margin-bottom: 16px; font-size: 18px; }
    
    .stats-bar { 
      background: #8B0018; color: white; padding: 12px 16px; border-radius: 8px; font-weight: bold; margin-bottom: 16px; 
      display: flex; justify-content: space-between; align-items: center; font-size: 13px; 
    }
    
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .icon-preview-box {
      display: none; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px; background: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px;
    }
    .icon-preview-box img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: #fff; }
    .icon-preview-details { display: flex; flex-direction: column; font-size: 12px; gap: 3px; }
    .frame-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; width: fit-content; }
    .badge-valid { background: #d1e7dd; color: #0f5132; }
    .badge-invalid { background: #f8d7da; color: #842029; }
    .badge-checking { background: #cff4fc; color: #055160; }

    .btn-submit { width: 100%; padding: 12px; background: #8B0018; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { width: 100%; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; display: none; }
    .status { margin-top: 10px; font-size: 13px; text-align: center; font-weight: 600; }

    .category-header { font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 6px; margin: 16px 0 10px 0; }
    .cat-valid { background: #e8f5e9; color: #1b5e20; border-left: 4px solid #2e7d32; }
    .cat-invalid { background: #ffebee; color: #b71c1c; border-left: 4px solid #c62828; }

    .app-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    .app-info-admin { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .app-info-admin img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .app-info-admin strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
    .app-info-admin small { color: #6c757d; display: block; font-size: 11px; word-break: break-all; }
    
    .action-group { display: flex; gap: 6px; flex-shrink: 0; }
    .btn-edit { background: #0d6efd; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="top-bar">
    <a href="new.html" class="back-btn">&#x2190; Back to New</a>
  </div>

  <div class="stats-bar">
    <span>Total Listed Websites</span>
    <span id="totalCount">0</span>
  </div>

  <div class="card">
    <h2 id="formTitle">Add New Website Link</h2>
    <input type="hidden" id="editKey">
    <input type="text" id="appName" placeholder="Website Name (e.g. Birr Go News)">
    <input type="text" id="appDesc" placeholder="Description (e.g. Latest News & Updates)">
    <input type="url" id="appUrl" placeholder="Website URL (e.g. https://example.com/)" oninput="debouncedIconPreview()">
    
    <div id="iconPreviewBox" class="icon-preview-box">
      <img id="iconPreviewImg" src="" alt="Icon Preview">
      <div class="icon-preview-details">
        <strong>Website Icon & Category Check</strong>
        <span id="frameBadge" class="frame-badge badge-checking">Testing Frame Category...</span>
      </div>
    </div>

    <button class="btn-submit" id="saveBtn" onclick="saveWebsite()">Add Website</button>
    <button class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>Database Sync (Categorized)</h2>
    <div id="adminAppList">Loading database...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCRHoIZf1ZPR9m3YYTv-I9CfwyGqsSOMWo",
      authDomain: "birrgo-fdf7e.firebaseapp.com",
      databaseURL: "https://birrgo-fdf7e-default-rtdb.firebaseio.com",
      projectId: "birrgo-fdf7e",
      storageBucket: "birrgo-fdf7e.firebasestorage.app",
      messagingSenderId: "2317445154",
      appId: "1:2317445154:web:4275cbb0f46b28f64f827b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let verifiedIconUrl = "";
    let detectedCanIframe = false;
    let debounceTimer = null;

    const UNFRAMEABLE_DOMAINS = [
      'bbc.com', 'bbc.co.uk', 'google.com', 'youtube.com', 
      'facebook.com', 'twitter.com', 'x.com', 'instagram.com', 
      'github.com', 'linkedin.com', 'amazon.com', 'reddit.com',
      'microsoft.com', 'apple.com', 'netflix.com', 'telegram.org', 't.me'
    ];

    function isKnownUnframeable(url) {
      try {
        const domain = new URL(url.startsWith('http') ? url : 'https://' + url).hostname.toLowerCase();
        return UNFRAMEABLE_DOMAINS.some(d => domain === d || domain.endsWith('.' + d));
      } catch(e) { return false; }
    }

    async function checkIframeSupport(url) {
      let formattedUrl = url.trim();
      if (!formattedUrl.startsWith('http')) formattedUrl = 'https://' + formattedUrl;

      if (isKnownUnframeable(formattedUrl)) return false;

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(formattedUrl), { 
          method: 'GET', signal: controller.signal 
        });
        clearTimeout(timeoutId);

        const xfo = response.headers.get('x-frame-options');
        const csp = response.headers.get('content-security-policy');
        controller.abort();

        if (xfo && (xfo.toUpperCase() === 'DENY' || xfo.toUpperCase() === 'SAMEORIGIN')) return false;
        if (csp && (csp.toLowerCase().includes('frame-ancestors') || csp.toLowerCase().includes("frame-src 'none'"))) return false;

        return true;
      } catch (e) {
        return false;
      }
    }

    function debouncedIconPreview() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updatePreview, 400);
    }

    async function updatePreview() {
      let rawUrl = document.getElementById('appUrl').value.trim();
      const previewBox = document.getElementById('iconPreviewBox');
      const previewImg = document.getElementById('iconPreviewImg');
      const frameBadge = document.getElementById('frameBadge');

      if (!rawUrl) { previewBox.style.display = 'none'; return; }
      if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) rawUrl = 'https://' + rawUrl;

      try {
        const urlObj = new URL(rawUrl);
        const origin = urlObj.origin;
        const domain = urlObj.hostname;

        if (domain && domain.includes('.')) {
          previewBox.style.display = 'flex';
          frameBadge.className = "frame-badge badge-checking";
          frameBadge.textContent = "Testing Validity Category...";

          checkIframeSupport(rawUrl).then(isFrameable => {
            detectedCanIframe = isFrameable;
            if (isFrameable) {
              frameBadge.className = "frame-badge badge-valid";
              frameBadge.textContent = "🟢 Category: VALID (iFrame Compatible)";
            } else {
              frameBadge.className = "frame-badge badge-invalid";
              frameBadge.textContent = "🔴 Category: INVALID (External Browser)";
            }
          });

          previewImg.src = `https://icon.horse/icon/${domain}`;
          verifiedIconUrl = previewImg.src;
        }
      } catch (e) { previewBox.style.display = 'none'; }
    }

    async function saveWebsite() {
      const editKey = document.getElementById('editKey').value;
      const name = document.getElementById('appName').value.trim();
      const desc = document.getElementById('appDesc').value.trim();
      let url = document.getElementById('appUrl').value.trim();
      const status = document.getElementById('status');

      if (!name || !url) { alert("Please enter Name and URL!"); return; }
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

      status.style.color = '#0d6efd';
      status.textContent = "Categorizing and saving to database...";

      const canIframe = await checkIframeSupport(url);
      const category = canIframe ? "valid" : "invalid"; // Save explicit category label

      let domain = url;
      try { domain = new URL(url).hostname; } catch(e) {}

      const payload = {
        name: name,
        description: desc || "Web Application",
        url: url,
        icon: verifiedIconUrl || `https://icon.horse/icon/${domain}`,
        canIframe: canIframe,
        category: category, // WRITES TO DATABASE AS "valid" OR "invalid"
        timestamp: Date.now()
      };

      if (editKey) {
        db.ref('pwa_apps/' + editKey).update(payload).then(() => {
          status.style.color = 'green';
          status.textContent = "Website updated successfully!";
          resetForm();
        });
      } else {
        db.ref('pwa_apps').push(payload).then(() => {
          status.style.color = 'green';
          status.textContent = "Website categorized & saved!";
          resetForm();
        });
      }
    }

    function editWebsite(key, name, desc, url) {
      document.getElementById('editKey').value = key;
      document.getElementById('appName').value = name;
      document.getElementById('appDesc').value = desc;
      document.getElementById('appUrl').value = url;
      document.getElementById('formTitle').textContent = "Edit Website Link";
      document.getElementById('saveBtn').textContent = "Update Website";
      document.getElementById('cancelBtn').style.display = "block";
      updatePreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editKey').value = '';
      document.getElementById('appName').value = '';
      document.getElementById('appDesc').value = '';
      document.getElementById('appUrl').value = '';
      document.getElementById('iconPreviewBox').style.display = 'none';
      document.getElementById('formTitle').textContent = "Add New Website Link";
      document.getElementById('saveBtn').textContent = "Add Website";
      document.getElementById('cancelBtn').style.display = "none";
    }

    function deleteWebsite(key) {
      if (confirm("Delete this website from database?")) {
        db.ref('pwa_apps/' + key).remove();
      }
    }

    db.ref('pwa_apps').on('value', (snapshot) => {
      const totalCount = document.getElementById('totalCount');
      const adminAppList = document.getElementById('adminAppList');

      if (!snapshot.exists()) {
        totalCount.textContent = '0';
        adminAppList.innerHTML = '<p style="color:#6c757d;">No websites in database.</p>';
        return;
      }

      const validItems = [];
      const invalidItems = [];

      snapshot.forEach((child) => {
        const key = child.key;
        const app = child.val();
        const category = app.category || (app.canIframe ? 'valid' : 'invalid');

        if (category === 'valid') validItems.push({ key, app });
        else invalidItems.push({ key, app });
      });

      totalCount.textContent = `${snapshot.numChildren()} (Valid: ${validItems.length} | Invalid: ${invalidItems.length})`;
      adminAppList.innerHTML = '';

      if (validItems.length > 0) {
        adminAppList.insertAdjacentHTML('beforeend', `<div class="category-header cat-valid">🟢 Category: Valid (${validItems.length})</div>`);
        validItems.forEach(({ key, app }) => adminAppList.insertAdjacentHTML('beforeend', createRow(key, app)));
      }

      if (invalidItems.length > 0) {
        adminAppList.insertAdjacentHTML('beforeend', `<div class="category-header cat-invalid">🔴 Category: Invalid (${invalidItems.length})</div>`);
        invalidItems.forEach(({ key, app }) => adminAppList.insertAdjacentHTML('beforeend', createRow(key, app)));
      }
    });

    function createRow(key, app) {
      const safeName = (app.name || '').replace(/'/g, "\\'");
      const safeDesc = (app.description || '').replace(/'/g, "\\'");
      const safeUrl = (app.url || '').replace(/'/g, "\\'");

      return `
        <div class="app-item">
          <div class="app-info-admin">
            <img src="${app.icon}" alt="Icon">
            <div><strong>${app.name}</strong><small>${app.url}</small></div>
          </div>
          <div class="action-group">
            <button class="btn-edit" onclick="editWebsite('${key}', '${safeName}', '${safeDesc}', '${safeUrl}')">Edit</button>
            <button class="btn-delete" onclick="deleteWebsite('${key}')">Delete</button>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
