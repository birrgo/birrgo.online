<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; max-width: 500px; margin: auto; }
    
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .back-btn {
      background: #333;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #8B0018; margin-bottom: 16px; font-size: 20px; }
    
    .stats-bar { 
      background: #8B0018; 
      color: white; 
      padding: 12px 16px; 
      border-radius: 8px; 
      font-weight: bold; 
      margin-bottom: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    
    .icon-preview-box {
      display: none;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 14px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .icon-preview-box img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      background: #fff;
    }
    .icon-preview-details {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }
    .icon-preview-details strong {
      color: #333;
      font-size: 13px;
    }
    .icon-preview-status {
      color: #0d6efd;
      font-weight: 600;
    }

    .btn-submit { width: 100%; padding: 12px; background: #8B0018; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { width: 100%; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; display: none; }
    button:active { transform: scale(0.98); }
    .status { margin-top: 10px; font-size: 13px; text-align: center; font-weight: 600; }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .app-item:last-child { border-bottom: none; }
    .app-info-admin { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .app-info-admin img { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; object-fit: cover; }
    .app-info-admin div { overflow: hidden; }
    .app-info-admin strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-info-admin small { color: #6c757d; display: block; font-size: 12px; word-break: break-all; }
    
    .action-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-edit {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="top-bar">
    <a href="new.html" class="back-btn">&#x2190; Back to New</a>
  </div>

  <div class="stats-bar">
    <span>Total Apps Listed</span>
    <span id="totalCount">0</span>
  </div>

  <div class="card">
    <h2 id="formTitle">Add New PWA Link</h2>
    <input type="hidden" id="editKey">
    <input type="text" id="appName" placeholder="App Name (e.g. Birr Go News)">
    <input type="text" id="appDesc" placeholder="Description (e.g. Latest News & Updates)">
    <input type="url" id="appUrl" placeholder="PWA Web Link (e.g. https://example.com/)" oninput="debouncedIconPreview()">
    
    <div id="iconPreviewBox" class="icon-preview-box">
      <img id="iconPreviewImg" src="" alt="Real PWA Icon Preview">
      <div class="icon-preview-details">
        <strong>PWA Real Icon</strong>
        <span id="iconStatus" class="icon-preview-status">Finding site icon...</span>
      </div>
    </div>

    <button class="btn-submit" id="saveBtn" onclick="savePWA()">Add PWA App</button>
    <button class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>Listed Apps (Realtime Sync)</h2>
    <div id="adminAppList">Loading real-time data...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCRHoIZf1ZPR9m3YYTv-I9CfwyGqsSOMWo",
      authDomain: "birrgo-fdf7e.firebaseapp.com",
      databaseURL: "https://birrgo-fdf7e-default-rtdb.firebaseio.com",
      projectId: "birrgo-fdf7e",
      storageBucket: "birrgo-fdf7e.firebasestorage.app",
      messagingSenderId: "2317445154",
      appId: "1:2317445154:web:4275cbb0f46b28f64f827b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let verifiedIconUrl = "";
    let debounceTimer = null;

    function debouncedIconPreview() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateIconPreview, 400);
    }

    function updateIconPreview() {
      let rawUrl = document.getElementById('appUrl').value.trim();
      const previewBox = document.getElementById('iconPreviewBox');
      const previewImg = document.getElementById('iconPreviewImg');
      const iconStatus = document.getElementById('iconStatus');

      if (!rawUrl) {
        previewBox.style.display = 'none';
        verifiedIconUrl = "";
        return;
      }

      if (!rawUrl.startsWith('http://') && !rawUrl.startsWith('https://')) {
        rawUrl = 'https://' + rawUrl;
      }

      try {
        const urlObj = new URL(rawUrl);
        const origin = urlObj.origin;
        const domain = urlObj.hostname;

        if (domain && domain.includes('.')) {
          previewBox.style.display = 'flex';
          iconStatus.textContent = "Extracting icon from PWA site...";
          iconStatus.style.color = "#0d6efd";

          const appleTouchIcon = `${origin}/apple-touch-icon.png`;
          const pwaManifestIcon = `https://icon.horse/icon/${domain}`;
          const googleFavicon = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

          previewImg.onerror = () => {
            if (previewImg.src === appleTouchIcon) {
              previewImg.src = pwaManifestIcon;
              verifiedIconUrl = pwaManifestIcon;
            } else if (previewImg.src === pwaManifestIcon) {
              previewImg.onerror = null;
              previewImg.src = googleFavicon;
              verifiedIconUrl = googleFavicon;
              iconStatus.textContent = "Site Icon Resolved";
              iconStatus.style.color = "#198754";
            }
          };

          previewImg.onload = () => {
            verifiedIconUrl = previewImg.src;
            iconStatus.textContent = "Real PWA Icon Verified";
            iconStatus.style.color = "#198754";
          };

          previewImg.src = appleTouchIcon;
          verifiedIconUrl = appleTouchIcon;

        } else {
          previewBox.style.display = 'none';
        }
      } catch (e) {
        previewBox.style.display = 'none';
      }
    }

    // Strict PWA Feature Inspector
    async function verifyPWA(targetUrl) {
      const status = document.getElementById('status');
      status.style.color = '#0d6efd';
      status.textContent = "Validating target for PWA Web App manifest & features...";

      const baseUrl = targetUrl.endsWith('/') ? targetUrl : targetUrl + '/';
      
      try {
        // Attempt manifest fetching and verification
        const manifestRes = await fetch(baseUrl + 'manifest.json', { method: 'HEAD', mode: 'cors' }).catch(() => null);
        if (manifestRes && manifestRes.ok) return true;

        const swRes = await fetch(baseUrl + 'sw.js', { method: 'HEAD', mode: 'cors' }).catch(() => null);
        if (swRes && swRes.ok) return true;

        // Fallback checks using HTML content scanning
        const htmlRes = await fetch(baseUrl, { mode: 'cors' }).catch(() => null);
        if (htmlRes && htmlRes.ok) {
          const htmlText = await htmlRes.text();
          if (htmlText.includes('rel="manifest"') || htmlText.includes('serviceWorker.register')) {
            return true;
          }
        }
      } catch (err) {
        console.warn("PWA inspection warning:", err);
      }

      // Prompt administrator if automated scanner is blocked by CORS/security headers
      return confirm("Automated scanner could not confirm a valid manifest.json or service worker on this domain (possibly due to CORS policies).\n\nDo you want to force add this site as a PWA anyway?");
    }

    async function savePWA() {
      const editKey = document.getElementById('editKey').value;
      const name = document.getElementById('appName').value.trim();
      const desc = document.getElementById('appDesc').value.trim();
      let url = document.getElementById('appUrl').value.trim();
      const status = document.getElementById('status');

      if (!name || !url) {
        alert("Please provide both App Name and PWA Web Link!");
        return;
      }
      
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const isPWA = await verifyPWA(url);
      if (!isPWA) {
        status.style.color = 'red';
        status.textContent = "Registration cancelled: URL does not have valid PWA capabilities.";
        return;
      }

      let domain = url;
      try { domain = new URL(url).hostname; } catch(e) {}

      const finalIcon = verifiedIconUrl || `https://icon.horse/icon/${domain}`;

      const payload = {
        name: name,
        description: desc || "Web PWA Application",
        url: url,
        icon: finalIcon,
        timestamp: Date.now()
      };

      if (editKey) {
        db.ref('pwa_apps/' + editKey).update(payload)
          .then(() => {
            status.style.color = 'green';
            status.textContent = "PWA updated successfully!";
            resetForm();
            setTimeout(() => status.textContent = '', 3000);
          })
          .catch(err => alert("Error updating app: " + err.message));
      } else {
        const newAppRef = db.ref('pwa_apps').push();
        newAppRef.set(payload).then(() => {
          status.style.color = 'green';
          status.textContent = "PWA added successfully!";
          resetForm();
          setTimeout(() => status.textContent = '', 3000);
        }).catch(err => {
          alert("Error adding app: " + err.message);
        });
      }
    }

    function editPWA(key, name, desc, url) {
      document.getElementById('editKey').value = key;
      document.getElementById('appName').value = name;
      document.getElementById('appDesc').value = desc;
      document.getElementById('appUrl').value = url;

      document.getElementById('formTitle').textContent = "Edit PWA Link";
      document.getElementById('saveBtn').textContent = "Update PWA App";
      document.getElementById('cancelBtn').style.display = "block";
      
      updateIconPreview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editKey').value = '';
      document.getElementById('appName').value = '';
      document.getElementById('appDesc').value = '';
      document.getElementById('appUrl').value = '';
      
      document.getElementById('iconPreviewBox').style.display = 'none';
      verifiedIconUrl = "";

      document.getElementById('formTitle').textContent = "Add New PWA Link";
      document.getElementById('saveBtn').textContent = "Add PWA App";
      document.getElementById('cancelBtn').style.display = "none";
    }

    function deletePWA(key) {
      if (confirm("Are you sure you want to delete this app?")) {
        db.ref('pwa_apps/' + key).remove()
          .catch(err => alert("Error deleting app: " + err.message));
      }
    }

    db.ref('pwa_apps').on('value', (snapshot) => {
      const totalCount = document.getElementById('totalCount');
      const adminAppList = document.getElementById('adminAppList');

      if (!snapshot.exists()) {
        totalCount.textContent = '0';
        adminAppList.innerHTML = '<p style="color: #6c757d; font-size: 14px;">No apps listed yet in database.</p>';
        return;
      }

      totalCount.textContent = snapshot.numChildren();
      adminAppList.innerHTML = '';

      snapshot.forEach((childSnapshot) => {
        const key = childSnapshot.key;
        const app = childSnapshot.val();

        const safeName = (app.name || '').replace(/'/g, "\\'");
        const safeDesc = (app.description || '').replace(/'/g, "\\'");
        const safeUrl = (app.url || '').replace(/'/g, "\\'");
        
        let safeDomain = safeUrl;
        try { safeDomain = new URL(safeUrl).hostname; } catch(e) {}

        const itemHTML = `
          <div class="app-item">
            <div class="app-info-admin">
              <img src="${app.icon}" onerror="this.onerror=null; this.src='https://www.google.com/s2/favicons?domain=${safeDomain}&sz=128'" alt="Icon">
              <div>
                <strong>${app.name}</strong>
                <small>${app.url}</small>
              </div>
            </div>
            <div class="action-group">
              <button class="btn-edit" onclick="editPWA('${key}', '${safeName}', '${safeDesc}', '${safeUrl}')">Edit</button>
              <button class="btn-delete" onclick="deletePWA('${key}')">Delete</button>
            </div>
          </div>
        `;
        adminAppList.insertAdjacentHTML('beforeend', itemHTML);
      });
    }, (error) => {
      console.error("Database error:", error);
      document.getElementById('adminAppList').innerHTML = `<p style="color: red;">Error loading data: ${error.message}</p>`;
    });
  </script>
</body>
</html>
