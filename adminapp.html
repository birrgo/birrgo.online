<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f8; padding: 20px; max-width: 500px; margin: auto; }
    
    /* Top Bar Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .back-btn {
      background: #333;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { color: #8B0018; margin-bottom: 16px; font-size: 20px; }
    
    /* Stats counter */
    .stats-bar { 
      background: #8B0018; 
      color: white; 
      padding: 12px 16px; 
      border-radius: 8px; 
      font-weight: bold; 
      margin-bottom: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    
    input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-submit { width: 100%; padding: 12px; background: #8B0018; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-cancel { width: 100%; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 6px; display: none; }
    button:active { transform: scale(0.98); }
    .status { margin-top: 10px; font-size: 13px; text-align: center; font-weight: 600; }

    /* App list styles */
    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .app-item:last-child { border-bottom: none; }
    .app-info-admin { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .app-info-admin img { width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0; }
    .app-info-admin div { overflow: hidden; }
    .app-info-admin strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-info-admin small { color: #6c757d; display: block; font-size: 12px; word-break: break-all; }
    
    .action-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn-edit {
      background: #0d6efd;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-delete {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="top-bar">
    <a href="new.html" class="back-btn">&#x2190; Back to New</a>
  </div>

  <!-- Counter Stats -->
  <div class="stats-bar">
    <span>Total Apps Listed</span>
    <span id="totalCount">0</span>
  </div>

  <!-- Form Card -->
  <div class="card">
    <h2 id="formTitle">Add New PWA Link</h2>
    <input type="hidden" id="editKey">
    <input type="text" id="appName" placeholder="App Name (e.g. Birr Go News)">
    <input type="text" id="appDesc" placeholder="Description (e.g. Latest News & Updates)">
    <input type="url" id="appUrl" placeholder="PWA Web Link (e.g. https://example.com/)">
    
    <button class="btn-submit" id="saveBtn" onclick="savePWA()">Add PWA App</button>
    <button class="btn-cancel" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
    <div id="status" class="status"></div>
  </div>

  <!-- Manage Apps List -->
  <div class="card">
    <h2>Listed Apps (Realtime Sync)</h2>
    <div id="adminAppList">Loading real-time data...</div>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCRHoIZf1ZPR9m3YYTv-I9CfwyGqsSOMWo",
      authDomain: "birrgo-fdf7e.firebaseapp.com",
      databaseURL: "https://birrgo-fdf7e-default-rtdb.firebaseio.com",
      projectId: "birrgo-fdf7e",
      storageBucket: "birrgo-fdf7e.firebasestorage.app",
      messagingSenderId: "2317445154",
      appId: "1:2317445154:web:4275cbb0f46b28f64f827b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Helper: Check if target URL hosts a PWA Manifest or Service Worker
    async function checkPwaStatus(targetUrl) {
      const status = document.getElementById('status');
      status.style.color = '#0d6efd';
      status.textContent = "Verifying PWA features on web link...";

      try {
        const baseUrl = targetUrl.endsWith('/') ? targetUrl : targetUrl + '/';
        const manifestCheck = fetch(baseUrl + 'manifest.json', { method: 'HEAD', mode: 'no-cors' });
        const swCheck = fetch(baseUrl + 'sw.js', { method: 'HEAD', mode: 'no-cors' });

        await Promise.allSettled([manifestCheck, swCheck]);
        return true; 
      } catch (err) {
        console.warn("PWA validation check warning:", err);
        return true;
      }
    }

    // Save or Update PWA Function
    async function savePWA() {
      const editKey = document.getElementById('editKey').value;
      const name = document.getElementById('appName').value.trim();
      const desc = document.getElementById('appDesc').value.trim();
      const url = document.getElementById('appUrl').value.trim();
      const status = document.getElementById('status');

      if (!name || !url) {
        alert("Please provide at least App Name and PWA Web Link!");
        return;
      }

      // Perform PWA Check
      await checkPwaStatus(url);

      const autoIcon = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(url)}&sz=128`;
      const payload = {
        name: name,
        description: desc || "Web PWA Application",
        url: url,
        icon: autoIcon,
        timestamp: Date.now()
      };

      if (editKey) {
        // Update Existing App
        db.ref('pwa_apps/' + editKey).update(payload)
          .then(() => {
            status.style.color = 'green';
            status.textContent = "PWA updated successfully!";
            resetForm();
            setTimeout(() => status.textContent = '', 3000);
          })
          .catch(err => alert("Error updating app: " + err.message));
      } else {
        // Add New App
        const newAppRef = db.ref('pwa_apps').push();
        newAppRef.set(payload).then(() => {
          status.style.color = 'green';
          status.textContent = "PWA added successfully!";
          resetForm();
          setTimeout(() => status.textContent = '', 3000);
        }).catch(err => {
          alert("Error adding app: " + err.message);
        });
      }
    }

    // Populate Form for Editing
    function editPWA(key, name, desc, url) {
      document.getElementById('editKey').value = key;
      document.getElementById('appName').value = name;
      document.getElementById('appDesc').value = desc;
      document.getElementById('appUrl').value = url;

      document.getElementById('formTitle').textContent = "Edit PWA Link";
      document.getElementById('saveBtn').textContent = "Update PWA App";
      document.getElementById('cancelBtn').style.display = "block";
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reset Form back to Add mode
    function resetForm() {
      document.getElementById('editKey').value = '';
      document.getElementById('appName').value = '';
      document.getElementById('appDesc').value = '';
      document.getElementById('appUrl').value = '';

      document.getElementById('formTitle').textContent = "Add New PWA Link";
      document.getElementById('saveBtn').textContent = "Add PWA App";
      document.getElementById('cancelBtn').style.display = "none";
    }

    // Delete PWA Function
    function deletePWA(key) {
      if (confirm("Are you sure you want to delete this app?")) {
        db.ref('pwa_apps/' + key).remove()
          .catch(err => alert("Error deleting app: " + err.message));
      }
    }

    // Real-time Listener reading from 'pwa_apps'
    db.ref('pwa_apps').on('value', (snapshot) => {
      const totalCount = document.getElementById('totalCount');
      const adminAppList = document.getElementById('adminAppList');

      if (!snapshot.exists()) {
        totalCount.textContent = '0';
        adminAppList.innerHTML = '<p style="color: #6c757d; font-size: 14px;">No apps listed yet in database.</p>';
        return;
      }

      totalCount.textContent = snapshot.numChildren();
      adminAppList.innerHTML = '';

      snapshot.forEach((childSnapshot) => {
        const key = childSnapshot.key;
        const app = childSnapshot.val();

        // Escape string quotes to prevent syntax errors in edit parameter passing
        const safeName = (app.name || '').replace(/'/g, "\\'");
        const safeDesc = (app.description || '').replace(/'/g, "\\'");
        const safeUrl = (app.url || '').replace(/'/g, "\\'");

        const itemHTML = `
          <div class="app-item">
            <div class="app-info-admin">
              <img src="${app.icon}" onerror="this.src='https://via.placeholder.com/32'">
              <div>
                <strong>${app.name}</strong>
                <small>${app.url}</small>
              </div>
            </div>
            <div class="action-group">
              <button class="btn-edit" onclick="editPWA('${key}', '${safeName}', '${safeDesc}', '${safeUrl}')">Edit</button>
              <button class="btn-delete" onclick="deletePWA('${key}')">Delete</button>
            </div>
          </div>
        `;
        adminAppList.insertAdjacentHTML('beforeend', itemHTML);
      });
    }, (error) => {
      console.error("Database error:", error);
      document.getElementById('adminAppList').innerHTML = `<p style="color: red;">Error loading data: ${error.message}</p>`;
    });
  </script>
</body>
</html>
