<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BirrGo Store - Web Store</title>
  
  <link rel="stylesheet" href="Apps.css">
  <link rel="stylesheet" href="wallet.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <script src="loader.js"></script>

  <!-- Smooth Curved Top Header -->
  <div class="store-curved-header">
    <svg class="bg-wave bg-wave-top" viewBox="0 0 1000 24" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 0 H1000 V8 Q500 24 0 8 Z" fill="url(#store_dark_burgundy_linear)"/>
      <defs>
        <linearGradient id="store_dark_burgundy_linear" x1="500" y1="0" x2="500" y2="24" gradientUnits="userSpaceOnUse">
          <stop stop-color="#2b000a"/>
          <stop offset="0.6" stop-color="#400010"/>
          <stop offset="1" stop-color="#5d0017"/>
        </linearGradient>
      </defs>
    </svg>

    <div class="header-top-row">
      <button class="store-nav-btn icon-3d" onclick="goToPage('news.html')" title="News Menu" style="display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <h1 class="header-title">BirrGo Store</h1>

      <button class="store-nav-btn icon-3d" onclick="openSearchModal()" title="Search" style="display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="category-menu-wrapper">
    <div class="category-menu">
      <button class="menu-tab active" onclick="switchCategory('installed', this)">Installed</button>
      <button class="menu-tab" onclick="switchCategory('birrgo', this)">BirrGo Apps</button>
      <button class="menu-tab" onclick="switchCategory('universal', this)">Universal</button>
      <button class="menu-tab" onclick="switchCategory('stores', this)">Stores</button>
    </div>
  </div>

  <main class="app-container" id="appList">
    <div class="loading-text">Loading store apps...</div>
  </main>

  <!-- SEARCH MODAL -->
  <div class="search-modal-overlay" id="searchModal">
    <div class="search-modal-header">
      <div class="search-input-pill">
        <span> 🔍 </span>
        <input type="text" id="globalSearchInput" placeholder="Enter App Name..." onkeyup="performGlobalSearch()">
      </div>
      <button class="search-cancel-btn" onclick="closeSearchModal()">Cancel</button>
    </div>
    
    <div class="search-hint-text" id="searchHint">Type an app name above to find apps quickly across all categories.</div>
    <div class="search-results-container" id="searchResults"></div>
  </div>

  <!-- UNINSTALL CONFIRMATION MODAL -->
  <div class="confirm-overlay" id="confirmModal">
    <div class="confirm-card">
      <img id="dialogIcon" class="dialog-app-icon" src="" alt="App Icon">
      <div class="confirm-title" id="dialogAppName">Uninstall App?</div>
      <div class="confirm-message">Are you sure you want to uninstall this application from your device?</div>
      <div class="confirm-actions">
        <button class="dialog-btn-cancel" onclick="closeUninstallModal()">Cancel</button>
        <button class="dialog-btn-remove" id="confirmOkBtn">Uninstall</button>
      </div>
    </div>
  </div>

  <!-- WEB PREVIEW MODAL -->
  <div id="webPreviewModal" class="web-preview-modal">
    <div class="preview-header">
      <button class="preview-back-btn" onclick="closeWebPreview()">&#8592; Back</button>
      <div class="preview-title" id="previewTitle">App Name</div>
      <div style="width: 40px;"></div>
    </div>
    <iframe id="previewIframe" class="preview-iframe" src="" allowfullscreen></iframe>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav-bar" id="bottomNavBar">
    <div id="navHome" class="nav-item">
      <svg viewBox="0 0 24 24">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Home
    </div>
    
    <div id="navTasks" class="nav-item">
      <svg viewBox="0 0 24 24">
        <polyline points="9 11 12 14 22 4"></polyline>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
      Tasks
    </div>

    <div id="navAppsCenter" class="nav-item active-tab">
      <div class="tab-icon-wrapper">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="9.5" height="9.5" rx="2.5" ry="2.5" stroke="currentColor" stroke-width="2" fill="none" />
          <rect x="15.5" y="3" width="9.5" height="9.5" rx="2.5" ry="2.5" stroke="currentColor" stroke-width="2" fill="none" />
          <rect x="3" y="15.5" width="9.5" height="9.5" rx="2.5" ry="2.5" stroke="currentColor" stroke-width="2" fill="none" />
          <rect x="15.5" y="15.5" width="9.5" height="9.5" rx="2.5" ry="2.5" stroke="currentColor" stroke-width="2" fill="none" />
        </svg>
      </div>
      Apps
    </div>

    <div id="navLottery" class="nav-item">
      <svg viewBox="0 0 24 24">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      Campaign
    </div>

    <div id="navWallet" class="nav-item">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
      Wallet
    </div>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCRHoIZf1ZPR9m3YYTv-I9CfwyGqsSOMWo",
      authDomain: "birrgo-fdf7e.firebaseapp.com",
      databaseURL: "https://birrgo-fdf7e-default-rtdb.firebaseio.com",
      projectId: "birrgo-fdf7e",
      storageBucket: "birrgo-fdf7e.firebasestorage.app",
      messagingSenderId: "2317445154",
      appId: "1:2317445154:web:4275cbb0f46b28f64f827b"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const appList = document.getElementById('appList');
    let allAppsData = [];
    let activeCategory = 'installed';
    let pendingUninstallKey = null;

    function showGlobalLoader(msg = "Loading...") {
      if (window.AppLoader && typeof window.AppLoader.show === 'function') {
        window.AppLoader.show(msg);
      }
    }

    function hideGlobalLoader() {
      if (window.AppLoader && typeof window.AppLoader.hide === 'function') {
        window.AppLoader.hide();
      }
    }

    window.goToPage = function(page) {
      if (page === '#') return;
      showGlobalLoader("Navigating...");
      window.location.replace(page);
    };

    document.addEventListener('DOMContentLoaded', () => {
      setupBottomNavigation();
    });

    function setupBottomNavigation() {
      document.getElementById('navHome').addEventListener('click', () => goToPage('dashboard.html'));
      document.getElementById('navTasks').addEventListener('click', () => goToPage('task.html'));
      document.getElementById('navAppsCenter').addEventListener('click', () => {});
      document.getElementById('navLottery').addEventListener('click', () => goToPage('lottery.html'));
      document.getElementById('navWallet').addEventListener('click', () => goToPage('wallet.html'));
    }

    function getAdminSize(app) {
      if (app.size || app.appSize) {
        let raw = app.size || app.appSize;
        return raw.toString().includes('MB') ? raw : raw + ' MB';
      }
      return '12.5 MB';
    }

    function isAppPaid(app) {
      return app.pricingType === 'paid' && parseFloat(app.price) > 0;
    }

    function openFullScreenAppPage(key) {
      showGlobalLoader("Opening Details...");
      window.location.href = `Fullap.html?key=${encodeURIComponent(key)}`;
    }

    function openSearchModal() {
      const modal = document.getElementById('searchModal');
      const input = document.getElementById('globalSearchInput');
      modal.style.display = 'flex';
      input.value = '';
      document.getElementById('searchResults').innerHTML = '';
      document.getElementById('searchHint').style.display = 'block';
      setTimeout(() => input.focus(), 100);
    }

    function closeSearchModal() {
      document.getElementById('searchModal').style.display = 'none';
      document.getElementById('globalSearchInput').value = '';
    }

    function performGlobalSearch() {
      const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('searchResults');
      const hintText = document.getElementById('searchHint');

      if (!query) {
        hintText.style.display = 'block';
        resultsContainer.innerHTML = '';
        return;
      }

      hintText.style.display = 'none';

      const matchedApps = allAppsData.filter(item => {
        const name = (item.app.name || '').toLowerCase();
        const desc = (item.app.description || '').toLowerCase();
        return name.includes(query) || desc.includes(query);
      });

      if (matchedApps.length === 0) {
        resultsContainer.innerHTML = '<div class="loading-text" style="color:white;">No apps found matching your search.</div>';
        return;
      }

      resultsContainer.innerHTML = '';
      matchedApps.forEach(({ key, app }) => {
        const name = app.name || 'App';
        const targetUrl = app.url || '#';
        const icon = app.icon || `https://icon.horse/icon/${getDomain(targetUrl)}`;
        const appSize = getAdminSize(app);
        const isInstalled = localStorage.getItem('site_installed_' + key);
        const isStore = app.sourceType === 'playstore' || app.sourceType === 'appstore' || app.category === 'store';
        const isPaid = isAppPaid(app);
        const isPurchased = localStorage.getItem('site_purchased_' + key);
        
        let btnLabel = isInstalled ? 'Open' : (isStore ? 'Get' : 'Install');
        let btnClass = isInstalled ? 'main-install-btn is-open' : 'main-install-btn';

        const subtextHtml = (isPaid && !isPurchased && !isInstalled) ? `<span class="btn-subtext">Paid (${app.price} ETB)</span>` : '';

        const cardHTML = `
          <div class="app-card" onclick="closeSearchModal(); openFullScreenAppPage('${key}');">
            <div class="app-info">
              <img src="${icon}" alt="${name}" class="app-icon" onerror="handleImageError(this, '${targetUrl}')">
              <div class="app-details">
                <h2>${name}</h2>
                <span class="app-size-badge">${appSize}</span>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
              <button class="${btnClass}" onclick="event.stopPropagation(); closeSearchModal(); openFullScreenAppPage('${key}');">${btnLabel}</button>
              ${subtextHtml}
            </div>
          </div>
        `;
        resultsContainer.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    function switchCategory(categoryKey, tabBtn) {
      showGlobalLoader("Loading Category...");
      setTimeout(() => {
        activeCategory = categoryKey;
        document.querySelectorAll('.menu-tab').forEach(tab => tab.classList.remove('active'));
        if (tabBtn) tabBtn.classList.add('active');
        renderAppList(allAppsData);
        hideGlobalLoader();
      }, 150);
    }

    function getDomain(url) {
      try {
        const u = new URL(url.startsWith('http') ? url : 'https://' + url);
        return u.hostname;
      } catch(e) { return url; }
    }

    function handleImageError(imgElement, appUrl) {
      const domain = getDomain(appUrl);
      imgElement.onerror = null;
      imgElement.src = `https://icon.horse/icon/${domain}`;
    }

    function launchWebsite(url, appName) {
      let formattedUrl = url.trim();
      if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) formattedUrl = 'https://' + formattedUrl;
      document.getElementById('previewTitle').textContent = appName || 'Web View';
      document.getElementById('previewIframe').src = formattedUrl;
      document.getElementById('webPreviewModal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function openApp(key, url, appName, isStore) {
      if (isStore) {
        window.location.href = url;
        return;
      }
      const appItem = allAppsData.find(item => item.key === key);
      let isValidForIframe = appItem && appItem.app ? (appItem.app.canIframe === true || appItem.app.category === 'valid') : false;
      
      let formattedUrl = url.trim();
      if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) formattedUrl = 'https://' + formattedUrl;

      if (isValidForIframe) launchWebsite(formattedUrl, appName);
      else window.open(formattedUrl, '_blank');
    }

    function closeWebPreview() {
      document.getElementById('webPreviewModal').style.display = 'none';
      document.getElementById('previewIframe').src = '';
      document.body.style.overflow = 'auto';
    }

    function promptUninstallApp(key, appName, iconUrl) {
      pendingUninstallKey = key;
      document.getElementById('dialogAppName').textContent = `Uninstall ${appName}?`;
      document.getElementById('dialogIcon').src = iconUrl;
      
      const okBtn = document.getElementById('confirmOkBtn');
      okBtn.onclick = function() {
        if (pendingUninstallKey) {
          localStorage.removeItem('site_installed_' + pendingUninstallKey);
          pendingUninstallKey = null;
          closeUninstallModal();
          renderAppList(allAppsData);
        }
      };

      document.getElementById('confirmModal').style.display = 'flex';
    }

    function closeUninstallModal() {
      document.getElementById('confirmModal').style.display = 'none';
      pendingUninstallKey = null;
    }

    function renderAppList(apps) {
      appList.innerHTML = '';

      const categoryApps = apps.filter(item => {
        const { key, app } = item;
        const isInstalled = localStorage.getItem('site_installed_' + key);
        const isStore = app.sourceType === 'playstore' || app.sourceType === 'appstore' || app.category === 'store';

        if (activeCategory === 'installed') return isInstalled && !isStore;
        if (activeCategory === 'birrgo') return !isInstalled && (app.canIframe === true || app.category === 'valid') && !isStore;
        if (activeCategory === 'universal') return !isInstalled && app.canIframe !== true && app.category !== 'valid' && !isStore;
        if (activeCategory === 'stores') return isStore;
        return false;
      });

      if (categoryApps.length === 0) {
        appList.innerHTML = '<div class="loading-text">No apps found in this category.</div>';
        return;
      }

      if (activeCategory === 'installed') {
        let gridHTML = '<div class="installed-grid">';
        categoryApps.forEach(({ key, app }) => {
          const name = app.name || 'App';
          const targetUrl = app.url || '#';
          const icon = app.icon || `https://icon.horse/icon/${getDomain(targetUrl)}`;
          const safeName = name.replace(/'/g, "\\'");

          gridHTML += `
            <div class="installed-app-item" onclick="openApp('${key}', '${targetUrl}', '${safeName}', false)" oncontextmenu="promptUninstallApp('${key}', '${safeName}', '${icon}'); return false;">
              <img src="${icon}" class="installed-app-icon" onerror="handleImageError(this, '${targetUrl}')" alt="${name}">
              <span class="installed-app-name">${name}</span>
            </div>
          `;
        });
        gridHTML += '</div>';
        appList.insertAdjacentHTML('beforeend', gridHTML);
        return;
      }

      categoryApps.forEach(({ key, app }) => {
        const name = app.name || 'App';
        const targetUrl = app.url || '#';
        const icon = app.icon || `https://icon.horse/icon/${getDomain(targetUrl)}`;
        const appSize = getAdminSize(app);
        const isInstalled = localStorage.getItem('site_installed_' + key);
        const isStore = app.sourceType === 'playstore' || app.sourceType === 'appstore' || app.category === 'store';
        const isPaid = isAppPaid(app);
        const isPurchased = localStorage.getItem('site_purchased_' + key);
        
        let btnLabel = isInstalled ? 'Open' : (isStore ? 'Get' : 'Install');
        let btnClass = isInstalled ? 'main-install-btn is-open' : 'main-install-btn';

        const subtextHtml = (isPaid && !isPurchased && !isInstalled) ? `<span class="btn-subtext">Paid (${app.price} ETB)</span>` : '';

        const cardHTML = `
          <div class="app-card" onclick="openFullScreenAppPage('${key}')">
            <div class="app-info">
              <img src="${icon}" alt="${name}" class="app-icon" onerror="handleImageError(this, '${targetUrl}')">
              <div class="app-details">
                <h2>${name}</h2>
                <div class="app-meta-badges">
                  <span class="app-size-badge">${appSize}</span>
                </div>
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center;">
              <button class="${btnClass}" onclick="event.stopPropagation(); openFullScreenAppPage('${key}');">${btnLabel}</button>
              ${subtextHtml}
            </div>
          </div>
        `;
        appList.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    db.ref('pwa_apps').on('value', (snapshot) => {
      allAppsData = [];
      if (!snapshot.exists()) {
        appList.innerHTML = '<div class="loading-text">No apps available in store.</div>';
        return;
      }

      snapshot.forEach((childSnapshot) => {
        allAppsData.push({
          key: childSnapshot.key,
          app: childSnapshot.val()
        });
      });

      renderAppList(allAppsData);
    }, (error) => {
      console.error("Database error:", error);
      appList.innerHTML = '<div class="loading-text" style="color:red;">Failed to load. Check connection.</div>';
    });
  </script>

</body>
</html>
