name: Deploy NewsApp Subdomain

on:
  push:
    branches:
      - main

# Grant GITHUB_TOKEN the necessary permissions to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload ONLY the NewsApp subfolder as the site root
      - name: Upload NewsApp Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './NewsApp'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
