<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App with Network Loader</title>
  
  <style>
    /* ==========================================
       1. LOADING OVERLAY STYLES
       ========================================== */
    .loader-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    /* Class used to hide the loader */
    .loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Spinner matching top curved header color (#5C0612) */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #5C0612;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Loading / Network Alert Text */
    .loader-text {
      margin-top: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #5C0612;
      text-align: center;
      padding: 0 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       2. LOADER HTML COMPONENT
       ========================================== -->
  <div id="app-loader" class="loader-overlay">
    <div class="spinner"></div>
    <p id="loader-text" class="loader-text">Loading...</p>
  </div>

  <!-- YOUR WEBSITE CONTENT GOES HERE -->


  <!-- ==========================================
       3. LOADER & NETWORK SCRIPT
       ========================================== -->
  <script>
    const loader = document.getElementById('app-loader');
    const loaderText = document.getElementById('loader-text');

    // Show loader function
    function showLoader(message = 'Loading...') {
      loaderText.textContent = message;
      loader.classList.remove('hidden');
    }

    // Hide loader function
    function hideLoader() {
      loader.classList.add('hidden');
    }

    // 1. Hide loader when initial page finishes loading
    window.addEventListener('load', () => {
      hideLoader();
    });

    // 2. Automatically detect network changes / offline mode
    window.addEventListener('offline', () => {
      showLoader('Connection lost. Waiting for network...');
    });

    window.addEventListener('online', () => {
      hideLoader();
    });

    // 3. Helper: Call this function for slow network API/data fetches
    async function fetchWithSlowNetworkCheck(url, options = {}, timeoutMs = 800) {
      // If request takes longer than 800ms, show network loading UI
      const timer = setTimeout(() => showLoader('Network is slow, loading...'), timeoutMs);
      
      try {
        const response = await fetch(url, options);
        return await response.json();
      } catch (error) {
        console.error('Network request failed:', error);
      } finally {
        clearTimeout(timer);
        hideLoader();
      }
    }
  </script>
</body>
</html>
