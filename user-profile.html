<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Console</title>
    <link rel="stylesheet" href="new.css">
    <style>
        body { padding: 30px; } 
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary-burgundy); font-weight: bold; text-decoration: none; }
        .btn-create-toggle {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-create-toggle:hover {
            background: #1d4ed8;
        }
        .admin-badge {
            font-size: 11px;
            background: #f59e0b;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <a href="new.html" class="back-link">← Back to Dashboard</a>
    <div class="toast-banner" id="adminToast">Action Completed Successfully</div>

    <!-- Custom Modal -->
    <div class="modal-overlay" id="customConfirmModal">
        <div class="modal-box">
            <h3 class="modal-title" id="modalTitleDisplay">Confirm Operational Request</h3>
            <p id="modalDescriptionDisplay" style="font-size:14px; color:var(--text-muted); margin-top:-8px;"></p>
            <div class="modal-content-details" id="modalDynamicDetails"></div>
            <div class="btn-row" style="margin-top: 10px;">
                <button class="btn-admin-action btn-modal-close" id="modalCancelBtn">Cancel</button>
                <button class="btn-admin-action" id="modalConfirmBtn">Proceed Execution</button>
            </div>
        </div>
    </div>

    <!-- Workspace Card -->
    <div class="workspace-card" style="margin: 0 auto; max-width: 500px; display: block; opacity: 1; pointer-events: auto;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 class="section-title title-blue" style="margin:0;">User Profile Console</h3>
            <button class="btn-create-toggle" id="toggleCreateAccountBtn">+ Add Account</button>
        </div>
        <p style="font-size:13px;color:var(--text-muted);margin-top: 6px;">
            Admin Account Routing: <strong>111111111111111</strong>
        </p>
        
        <!-- Search Section -->
        <div class="input-field-wrapper" id="searchSectionWrapper">
            <label for="profileSearchInput">Target Card / Phone Identifier</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="profileSearchInput" class="admin-input" placeholder="e.g. 914447872278441 or 111111111111111">
                <button class="btn-admin-action btn-broadcast" id="profileSearchBtn" style="width: auto; padding: 0 20px;">Search</button>
            </div>
        </div>

        <!-- Edit Profile Form -->
        <div id="profileManagementFields" style="display: none; flex-direction: column; gap: 14px; margin-top: 15px; border-top: 1px dashed var(--border-light); padding-top: 15px;">
            <h4 style="margin:0; font-size:14px; color:var(--text-main);">Manage Existing Profile</h4>
            <div class="input-field-wrapper">
                <label for="editProfileName">Full Name Matrix</label>
                <input type="text" id="editProfileName" class="admin-input">
            </div>
            <div class="input-field-wrapper">
                <label for="editProfilePass">Access Password Key</label>
                <input type="text" id="editProfilePass" class="admin-input">
            </div>
            <div class="input-field-wrapper">
                <label for="editProfilePhone">Phone Identity Node</label>
                <input type="text" id="editProfilePhone" class="admin-input">
            </div>
            <div class="input-field-wrapper">
                <label for="editProfileBalance">Account Deposit Balance (ETB)</label>
                <input type="number" id="editProfileBalance" class="admin-input" placeholder="0.00">
            </div>
            <div class="btn-row" style="margin-top: 10px; gap: 10px;">
                <button class="btn-admin-action btn-update" id="saveProfileBtn" style="flex: 1;">Save Changes</button>
                <button class="btn-admin-action btn-delete" id="deleteProfileAccountBtn" style="flex: 1;">Delete Account</button>
            </div>
        </div>

        <!-- Create Profile Form -->
        <div id="profileCreateFields" style="display: none; flex-direction: column; gap: 14px; margin-top: 15px; border-top: 1px dashed var(--border-light); padding-top: 15px;">
            <h4 style="margin:0; font-size:14px; color:#10b981;">Create & Provision Account</h4>
            <div class="input-field-wrapper">
                <label for="createProfileName">Full Name</label>
                <input type="text" id="createProfileName" class="admin-input" placeholder="e.g. Abebe Bikila">
            </div>
            <div class="input-field-wrapper">
                <label for="createProfilePass">Password</label>
                <input type="text" id="createProfilePass" class="admin-input" placeholder="e.g. Pass1234">
            </div>
            <div class="input-field-wrapper">
                <label for="createProfilePhone">Phone Identity (Without leading 0)</label>
                <input type="text" id="createProfilePhone" class="admin-input" placeholder="e.g. 911234567">
            </div>
            <div class="input-field-wrapper">
                <label for="createProfileInitialDeposit">Initial Deposit Amount (ETB)</label>
                <input type="number" id="createProfileInitialDeposit" class="admin-input" value="0" min="0">
            </div>
            <div class="btn-row" style="margin-top: 10px; gap: 10px;">
                <button class="btn-admin-action btn-update" id="submitCreateProfileBtn" style="flex: 1; background: #10b981;">Provision Account</button>
                <button class="btn-admin-action btn-modal-close" id="cancelCreateProfileBtn" style="flex: 1;">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, get, set, remove } from "./db.js";

        const ADMIN_CARD_CODE = "111111111111111"; // Fixed 15-digit Admin Payment Routing Account

        let currentModalResolver = null;
        let localUserDirectoryCache = {};
        let activeManagedUserPhone = null;
        let activeManagedUserProfile = null;

        // Populate initial directory
        get(ref(db, 'users')).then(snap => { 
            if(snap.exists()) localUserDirectoryCache = snap.val(); 
        }).catch(() => triggerAdminAlert("Error initializing local directory.", false));

        // Modal Handlers
        function openCustomModal(title, desc, detailsArray, actionClass, actionText) {
            document.getElementById('modalTitleDisplay').innerText = title; 
            document.getElementById('modalDescriptionDisplay').innerText = desc;
            
            const container = document.getElementById('modalDynamicDetails'); 
            container.innerHTML = '';
            
            detailsArray.forEach(item => { 
                container.innerHTML += `<div class="modal-data-row"><span class="modal-data-label">${item.label}</span><span class="modal-data-value">${item.value}</span></div>`; 
            });

            const confirmBtn = document.getElementById('modalConfirmBtn');
            confirmBtn.className = "btn-admin-action " + actionClass; 
            confirmBtn.innerText = actionText;

            document.getElementById('customConfirmModal').classList.add('active'); 
            return new Promise(r => currentModalResolver = r);
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => { 
            if(currentModalResolver) currentModalResolver(true); 
            document.getElementById('customConfirmModal').classList.remove('active'); 
        });

        document.getElementById('modalCancelBtn').addEventListener('click', () => { 
            if(currentModalResolver) currentModalResolver(false); 
            document.getElementById('customConfirmModal').classList.remove('active'); 
        });

        // Toast Notification
        function triggerAdminAlert(msg, isSuccess = true) {
            const toast = document.getElementById('adminToast'); 
            toast.innerText = msg;
            toast.style.background = isSuccess ? 'linear-gradient(135deg, #10b981 0%, #059669 100%)' : 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
            toast.style.display = 'block'; 
            setTimeout(() => toast.style.display = 'none', 3500);
        }

        // Card Generator
        function generate15DigitCard(p) { 
            const c = p.replace(/\D/g, ''); 
            if (!c) return '';
            return c + c.slice(-6).split('').reverse().join(''); 
        }

        // Lookup Helper
        async function lookupUserProfileByCardOrPhone(input) {
            const clean = input.replace(/\s/g, '').replace(/^0+/, ''); 
            
            if(localUserDirectoryCache[clean]) return { phoneKey: clean, profile: localUserDirectoryCache[clean] };

            for(let k of Object.keys(localUserDirectoryCache)){
                const p = localUserDirectoryCache[k];
                const storedCard = p.cardNumber ? p.cardNumber.replace(/\s/g, '') : '';
                if(storedCard === clean || generate15DigitCard(k) === clean) {
                    return { phoneKey: k, profile: p };
                }
            } 
            return null;
        }

        // UI Panel Toggle
        const profileManagementFields = document.getElementById('profileManagementFields');
        const profileCreateFields = document.getElementById('profileCreateFields');
        const searchSectionWrapper = document.getElementById('searchSectionWrapper');
        const toggleCreateAccountBtn = document.getElementById('toggleCreateAccountBtn');

        function resetForms() {
            profileManagementFields.style.display = 'none';
            profileCreateFields.style.display = 'none';
            searchSectionWrapper.style.display = 'block';
            toggleCreateAccountBtn.innerText = "+ Add Account";
            
            document.getElementById('createProfileName').value = '';
            document.getElementById('createProfilePass').value = '';
            document.getElementById('createProfilePhone').value = '';
            document.getElementById('createProfileInitialDeposit').value = '0';
        }

        toggleCreateAccountBtn.addEventListener('click', () => {
            if (profileCreateFields.style.display === 'flex') {
                resetForms();
            } else {
                profileManagementFields.style.display = 'none';
                profileCreateFields.style.display = 'flex';
                toggleCreateAccountBtn.innerText = "← Close Creation";
            }
        });

        document.getElementById('cancelCreateProfileBtn').addEventListener('click', resetForms);

        // Search Trigger
        async function performSearch() {
            resetForms();
            const input = document.getElementById('profileSearchInput').value.trim(); 
            if(!input) return triggerAdminAlert("Valid parameter missing.", false);

            const match = await lookupUserProfileByCardOrPhone(input);
            if(!match) { 
                triggerAdminAlert("No record found.", false); 
                return; 
            }

            activeManagedUserPhone = match.phoneKey; 
            activeManagedUserProfile = match.profile;

            document.getElementById('editProfileName').value = activeManagedUserProfile.fullName || '';
            document.getElementById('editProfilePass').value = activeManagedUserProfile.password || '';
            document.getElementById('editProfilePhone').value = activeManagedUserPhone;
            document.getElementById('editProfileBalance').value = activeManagedUserProfile.balance || 0;
            
            profileManagementFields.style.display = 'flex'; 
            triggerAdminAlert("Loaded!", true);
        }

        document.getElementById('profileSearchBtn').addEventListener('click', performSearch);
        document.getElementById('profileSearchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Create Account Action with Payment Routing
        document.getElementById('submitCreateProfileBtn').addEventListener('click', async () => {
            const name = document.getElementById('createProfileName').value.trim();
            const pass = document.getElementById('createProfilePass').value.trim();
            const rawPhone = document.getElementById('createProfilePhone').value.trim().replace(/\D/g, '');
            const phone = rawPhone.replace(/^0+/, '');
            const depositAmount = parseFloat(document.getElementById('createProfileInitialDeposit').value) || 0;

            if(!name || !pass || !phone) return triggerAdminAlert("Fill all required fields.", false);
            
            if (localUserDirectoryCache[phone]) {
                return triggerAdminAlert("An account with this phone already exists.", false);
            }

            const userCardNum = generate15DigitCard(phone);

            const confirmed = await openCustomModal(
                "Confirm Provision & Deposit", 
                "Creating user and linking to payment routing admin card.", 
                [
                    {label:"User Name:", value: name}, 
                    {label:"Phone Node:", value: "+251" + phone},
                    {label:"Generated Card:", value: userCardNum},
                    {label:"Admin Payment Router:", value: ADMIN_CARD_CODE},
                    {label:"Deposit Balance:", value: depositAmount + " ETB"}
                ], 
                "btn-update", 
                "Confirm & Authorize"
            );

            if(!confirmed) return;

            try {
                const newProfile = {
                    fullName: name,
                    firstName: name.split(' ')[0] || name,
                    password: pass,
                    cardNumber: userCardNum,
                    balance: depositAmount,
                    adminRoutingCard: ADMIN_CARD_CODE,
                    createdAt: new Date().toISOString(),
                    depositHistory: depositAmount > 0 ? [{
                        amount: depositAmount,
                        sourceAdminCard: ADMIN_CARD_CODE,
                        timestamp: new Date().toISOString(),
                        type: "INITIAL_ADMIN_DEPOSIT"
                    }] : []
                };

                await set(ref(db, `users/${phone}`), newProfile);
                
                // Keep local directory cache synchronized
                localUserDirectoryCache[phone] = newProfile;

                triggerAdminAlert("Account provisioned & linked to admin card!", true);
                resetForms();
            } catch(e) {
                triggerAdminAlert("Failed to complete account provision.", false);
            }
        });

        // Save Modifications
        document.getElementById('saveProfileBtn').addEventListener('click', async () => {
            if(!activeManagedUserPhone) return;

            const name = document.getElementById('editProfileName').value.trim();
            const pass = document.getElementById('editProfilePass').value.trim();
            const rawPhone = document.getElementById('editProfilePhone').value.trim().replace(/\D/g, '');
            const phone = rawPhone.replace(/^0+/, '');
            const newBalance = parseFloat(document.getElementById('editProfileBalance').value) || 0;

            if(!name || !pass || !phone) return triggerAdminAlert("Fill all criteria.", false);

            const confirmed = await openCustomModal(
                "Confirm Overrides", 
                "Altering user structural ledger.", 
                [
                    {label:"Name:", value: name}, 
                    {label:"Route:", value: "+251" + phone},
                    {label:"Updated Balance:", value: newBalance + " ETB"},
                    {label:"Payment Router:", value: ADMIN_CARD_CODE}
                ], 
                "btn-update", 
                "Apply Overrides"
            );

            if(!confirmed) return;

            try {
                let updatedProfile = { 
                    ...activeManagedUserProfile, 
                    fullName: name, 
                    firstName: name.split(' ')[0] || name, 
                    password: pass,
                    balance: newBalance,
                    adminRoutingCard: ADMIN_CARD_CODE
                };

                if (phone !== activeManagedUserPhone) { 
                    updatedProfile.cardNumber = generate15DigitCard(phone); 
                    
                    await set(ref(db, `users/${phone}`), updatedProfile); 
                    await remove(ref(db, `users/${activeManagedUserPhone}`)); 

                    delete localUserDirectoryCache[activeManagedUserPhone];
                    localUserDirectoryCache[phone] = updatedProfile;
                } else { 
                    await set(ref(db, `users/${activeManagedUserPhone}`), updatedProfile); 
                    localUserDirectoryCache[activeManagedUserPhone] = updatedProfile;
                }

                triggerAdminAlert("Profile & ledger updated safely!", true); 
                resetForms();
                activeManagedUserPhone = null;
                activeManagedUserProfile = null;
            } catch(e) { 
                triggerAdminAlert("Mutation rejected.", false); 
            }
        });

        // Delete Account Action
        document.getElementById('deleteProfileAccountBtn').addEventListener('click', async () => {
            if(!activeManagedUserPhone) return;

            const confirmed = await openCustomModal(
                "CRITICAL: Wipe Account", 
                "Removes account and payment ties permanently.", 
                [{label:"Target:", value: "+251" + activeManagedUserPhone}], 
                "btn-delete", 
                "Erase Node"
            );

            if(!confirmed) return;

            try { 
                await remove(ref(db, `users/${activeManagedUserPhone}`)); 
                delete localUserDirectoryCache[activeManagedUserPhone];

                triggerAdminAlert("Cleaned!", true); 
                resetForms(); 
                activeManagedUserPhone = null;
                activeManagedUserProfile = null;
            } catch(e) { 
                triggerAdminAlert("Wipe failure.", false); 
            }
        });
    </script>
</body>
</html>
